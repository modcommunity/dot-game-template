# This game's descriptor: what a server runs when it installs this repository's pack.
#
# It travels INSIDE the pack (dot-ci's package.sh --pack keeps it at the root), so a server
# started with `TMC_GAMES=<site username>/<repo>` needs nothing else: `./server install-games`
# fetches the pack, verifies its signature, and writes this file to content/<repo>/game.yml,
# where the operator can edit it.
#
# content_id, version and kind are STAMPED by the installer from the pack it verified: the
# site addresses a pack as <site username>/<repo name> and a re-published tag becomes
# 1.2.0+r2, and this file cannot know either. What is written here for them is a placeholder.
#
# Every path is relative to the pack's mount point, which is this repository's root. They
# MUST be relative: a server resolves them under res://dot_cloud/<content_id>/<version>/, and a
# client refuses any absolute scene path a server sends it.

content_id: you/dot-game-template
version: 0.0.0
kind: pack

name: Coin Grab

scene: scenes/tpl_server.tscn
client_scene: scenes/tpl_client.tscn
module: game/tpl_module.gd

max_players: 16

# Content beyond this pack, each entry a published pack <owner>/<name>, optionally with
# @<version>; the server's installer pins every entry to a concrete version and checks it
# exists, so an unpublished one fails at startup rather than in front of players.
#
#   dependencies:          the server and every player mount it with the game
#                          (shared art, sounds)
#   server_dependencies:   only the server mounts it; players never download it
#                          (bot data, rulesets)
#   maps:                  the game's delivered maps, one pack per map, fetched when the
#                          server changes to one; turn them into dot-map entries with
#                          DotMapCatalogue.add_delivered(key, scene)
#
# dependencies:
#   - you/shared-art
# server_dependencies:
#   - you/bot-routes
# maps:
#   - you/coin_field
#   - you/coin_canyon
